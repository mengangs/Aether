# 跨平台核心库：格式、架构约束、构建与测试（docs/03 §7）。
name: core

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux · Swift 6.4
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: System libraries
        # GRDB 在 Linux 上链接系统 SQLite（docs/03 §5.2）。
        run: apt-get update -qq && apt-get install -y -qq libsqlite3-dev > /dev/null

      - name: Swift version
        run: swift --version

      - name: Format
        run: >
          swift format lint --strict --recursive
          Packages/AetherKit/Sources Packages/AetherKit/Tests Packages/AetherKit/Package.swift Scripts

      - name: Architecture
        run: Scripts/ci-run.sh swift Scripts/check-architecture.swift .

      - name: Build
        run: Scripts/ci-run.sh swift build --package-path Packages/AetherKit

      - name: Test
        run: Scripts/ci-run.sh swift test --package-path Packages/AetherKit --parallel

      - name: CLI smoke test
        run: |
          swift run --package-path Packages/AetherKit aether-cli check examples/full.conf
          swift run --package-path Packages/AetherKit aether-cli match examples/full.conf \
            --url https://api.example.com/v1 --resolve api.example.com=198.51.100.1
          swift run --package-path Packages/AetherKit aether-cli render examples/full.conf --redact > /dev/null

  bench:
    name: Benchmarks · Linux
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: System libraries
        # GRDB 在 Linux 上链接系统 SQLite（docs/03 §5.2）。
        run: apt-get update -qq && apt-get install -y -qq libsqlite3-dev > /dev/null

      - name: Restore baseline (last main run)
        uses: actions/cache/restore@v6
        with:
          path: bench-baseline.json
          key: bench-baseline-${{ github.sha }}
          restore-keys: bench-baseline-

      - name: Run benchmarks (release)
        run: |
          baseline=""
          if [ -f bench-baseline.json ]; then baseline="--baseline bench-baseline.json"; fi
          swift build -c release --package-path Packages/AetherKit --product aether-bench
          swift run -c release --package-path Packages/AetherKit aether-bench $baseline --output bench-results.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
          cp bench-results.json bench-baseline.json

      - name: Save baseline
        uses: actions/cache/save@v6
        with:
          path: bench-baseline.json
          key: bench-baseline-${{ github.sha }}
