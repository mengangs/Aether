# Apple 平台：AetherKit 在 macOS 主机上的完整测试（含 Apple 专有模块）与 iOS 工程构建（docs/03 §7）。
name: ios

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # runner 镜像变更导致构建失败时，优先在这里固定 Xcode 版本（docs/03 §7）。
  XCODE_APP: /Applications/Xcode_27.1.app

jobs:
  build:
    name: macOS · Xcode 27
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          swift --version

      - id: hev
        run: echo "rev=$(git -C Vendor/hev-socks5-tunnel rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache hev xcframework
        uses: actions/cache@v6
        with:
          path: Packages/AetherKit/Binaries
          key: hev-${{ steps.hev.outputs.rev }}-${{ hashFiles('Scripts/build-hev.sh') }}-${{ env.XCODE_APP }}

      - name: Build hev xcframework
        run: ./Scripts/build-hev.sh

      - name: Architecture
        run: swift Scripts/check-architecture.swift .

      - name: Package tests (macOS host)
        run: swift test --package-path Packages/AetherKit --parallel
