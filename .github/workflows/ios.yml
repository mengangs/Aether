# Apple 平台：AetherKit 在 macOS 主机上的完整测试（含 Apple 专有模块）与 iOS 工程构建（docs/03 §7）。
name: ios

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # runner 镜像变更导致构建失败时，优先在这里固定 Xcode 版本（docs/03 §7）。
  XCODE_APP: /Applications/Xcode_27.1.app

jobs:
  build:
    name: macOS · Xcode 27
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          swift --version

      - id: hev
        run: echo "rev=$(git -C Vendor/hev-socks5-tunnel rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache hev xcframework
        uses: actions/cache@v6
        with:
          path: Packages/AetherKit/Binaries
          key: hev-${{ steps.hev.outputs.rev }}-${{ hashFiles('Scripts/build-hev.sh') }}-${{ env.XCODE_APP }}

      - name: Build hev xcframework
        run: Scripts/ci-run.sh ./Scripts/build-hev.sh

      - name: Architecture
        run: Scripts/ci-run.sh swift Scripts/check-architecture.swift .

      - name: Package tests (macOS host)
        run: Scripts/ci-run.sh swift test --package-path Packages/AetherKit --parallel

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Identifier overrides
        # 仓库变量（Settings → Secrets and variables → Actions → Variables），未设置时使用通用默认值（docs/03 §8.4）。
        env:
          AETHER_BUNDLE_ID_PREFIX: ${{ vars.AETHER_BUNDLE_ID_PREFIX }}
          AETHER_TUNNEL_BUNDLE_ID: ${{ vars.AETHER_TUNNEL_BUNDLE_ID }}
          AETHER_WIDGET_BUNDLE_ID: ${{ vars.AETHER_WIDGET_BUNDLE_ID }}
          AETHER_APP_GROUP: ${{ vars.AETHER_APP_GROUP }}
          AETHER_KEYCHAIN_GROUP: ${{ vars.AETHER_KEYCHAIN_GROUP }}
          AETHER_TEAM_ID: ${{ vars.AETHER_TEAM_ID }}
          AETHER_URL_SCHEME: ${{ vars.AETHER_URL_SCHEME }}
        run: ./Scripts/write-ci-xcconfig.sh

      - name: Generate project
        run: ./Scripts/bootstrap.sh

      - name: Build iOS
        run: |
          set -o pipefail
          xcodebuild build \
            -project Aether.xcodeproj -scheme Aether \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=$(git rev-list --count HEAD) \
            | xcbeautify --renderer github-actions
