[General]
loglevel = notice
tun-included-routes = 0.0.0.0/0
encrypted-dns-server = quic://dns.example.net

[Proxy]
Snell = snell, snell.example.net, 443, psk=example-psk, version=4
SSH = ssh, ssh.example.net, 22, username=root, password=example-password
Old-SS = ss, old.example.net, 8388, encrypt-method=aes-256-cfb, password=example-password
Legacy-VMess = vmess, vm.example.net, 443, username=1f2e3d4c-5b6a-4978-8a9b-0c1d2e3f4a5b, vmess-aead=false
Vision = vless, vision.example.net, 443, username=1f2e3d4c-5b6a-4978-8a9b-0c1d2e3f4a5b, tls=true, flow=xtls-rprx-vision
Fast = https, fast.example.net, 443, tfo=true
Hy2 = hysteria2, hy2.example.net, 443, password=example-password

[Proxy Group]
Proxy = select, Snell, SSH, Old-SS, Legacy-VMess, Vision, Fast, Hy2, DIRECT

[Rule]
PROCESS-NAME,ExampleApp,DIRECT
SRC-IP,192.168.1.2,DIRECT
SCRIPT,classify,Proxy
CELLULAR-RADIO,NR,DIRECT
DOMAIN-SUFFIX,example.com,Proxy,extended-matching
FINAL,Proxy

[Panel]
info = title=Example, content=x

[WireGuard home]
private-key = example-key
