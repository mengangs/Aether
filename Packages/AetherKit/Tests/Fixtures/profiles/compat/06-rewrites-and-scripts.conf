[General]
loglevel = notice

[Rule]
FINAL,DIRECT

[URL Rewrite]
^https?://(www\.)?example\.com/old/(.*) https://example.com/new/$2 302
^https?://ads\.example\.com/ - reject-img
^https?://track\.example\.com/ - reject-dict
^https?://api\.example\.com/v1/ https://api.example.com/v2/ header

[Header Rewrite]
^https://api\.example\.com/ header-add X-Debug 1
http-response ^https://api\.example\.com/ header-del Set-Cookie
http-request ^https://api\.example\.com/ header-replace-regex User-Agent "^(.*)$" "$1 Aether"

[Body Rewrite]
http-response ^https://api\.example\.com/v2/config "\"ads\":true" "\"ads\":false" "\"vip\":false" "\"vip\":true"

[Map Local]
^https://api\.example\.com/v2/banner data-type=json data="{\"items\":[]}"
^https://img\.example\.com/pixel\.gif data-type=tiny-gif
^https://static\.example\.com/app\.json data-type=file data=https://files.example.com/app.json header="Cache-Control:no-store"

[Script]
req = type=http-request, pattern=^https://api\.example\.com/, script-path=req.js, argument=a=1
res = type=http-response, pattern=^https://api\.example\.com/v2/, requires-body=true, max-size=524288, script-path=https://scripts.example.com/res.js, binary-body-mode=false
nightly = type=cron, cronexp="30 3 * * *", script-path=nightly.js, timeout=60
net = type=event, event-name=network-changed, script-path=net.js
tool = type=generic, script-path=tool.js
res = type=generic, script-path=duplicate.js

[MITM]
hostname = api.example.com, img.example.com, static.example.com
