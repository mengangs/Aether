#!MANAGED-CONFIG https://sub.example.com/aether?token=example-token interval=43200 strict=true

[General]
loglevel = notice
dns-server = system
proxy-test-url = http://cp.example.com/generate_204

[Proxy Group]
节点选择 = select, 自动选择, 故障转移, policy-path=https://sub.example.com/nodes?token=example-token, update-interval=43200
自动选择 = url-test, policy-path=https://sub.example.com/nodes?token=example-token, interval=300, tolerance=50
故障转移 = fallback, policy-path=https://sub.example.com/nodes?token=example-token, policy-regex-filter=(香港|HK|Hong), interval=300
负载均衡 = load-balance, policy-path=https://sub.example.com/nodes?token=example-token, persistent=true

[Rule]
DOMAIN-SUFFIX,example-streaming.example,节点选择
DOMAIN-KEYWORD,example-ads,REJECT
IP-CIDR,198.51.100.0/24,DIRECT,no-resolve
GEOIP,CN,DIRECT
FINAL,节点选择
