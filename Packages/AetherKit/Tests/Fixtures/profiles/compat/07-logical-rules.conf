[Proxy]
P = socks5, 192.0.2.10, 1080

[Rule]
AND,((DOMAIN-SUFFIX,example.com),(DEST-PORT,443)),P
OR,((DOMAIN-KEYWORD,tracker),(DOMAIN-SUFFIX,ads.example.net),(URL-REGEX,"^https://[^/]+/(ad|ads)/\?id=1,2")),REJECT
NOT,((OR,((GEOIP,CN),(IP-CIDR,192.0.2.0/24,no-resolve)))),P
AND,((NOT,((PROTOCOL,UDP))),(OR,((HOSTNAME-TYPE,IPv4),(HOSTNAME-TYPE,IPv6)))),DIRECT
AND,((USER-AGENT,"Example, App*"),(DOMAIN,api.example.com)),P
FINAL,DIRECT
