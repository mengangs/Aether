stray = value before any section
[General]
loglevel = shout
tun-mtu = 64

[Proxy]
Dup = https, a.example.com, 443
Dup = https, b.example.com, 443
DIRECT = https, c.example.com, 443
Bad-Port = https, d.example.com, 0
Missing = trojan, e.example.com, 443
Broken = https, "f.example.com, 443

[Proxy Group]
Cycle-A = select, Cycle-B
Cycle-B = select, Cycle-A
Empty = select
Ghost = select, Nobody

[Rule]
DOMAIN,a.example.com,Unknown-Policy
IP-CIDR,10.0.0.0/40,DIRECT
URL-REGEX,"(unclosed",DIRECT
DEST-PORT,99999,DIRECT
TELEPORT,x,DIRECT
DOMAIN-SUFFIX,a.example.com,DIRECT,sometimes
[Host]
bad.example.com = not an address
[URL Rewrite]
only-two-fields here
