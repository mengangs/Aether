# hash comment
; semicolon comment
// slash comment
   #   indented hash comment

[General]
# 注释可以出现在节内任何位置
loglevel = info
	// tab-indented comment
dns-server = system

[Proxy]
# A = https, a.example.com, 443   ← 被注释掉的节点不会被解析
B = http, b.example.com, 8080

[Rule]
# 规则中的 # 不是行尾注释：值里出现 # 也是值的一部分
USER-AGENT,Example#App*,B
DOMAIN,b.example.com,B
FINAL,DIRECT
