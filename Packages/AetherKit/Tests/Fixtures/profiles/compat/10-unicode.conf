# 名称含 emoji、空格与中文；域名含国际化域名
[Proxy]
🇭🇰 香港 01 = ss, 香港.例子.测试, 8388, encrypt-method=aes-128-gcm, password=example-password
🇯🇵 日本 = trojan, jp.example.net, 443, password=example-password

[Proxy Group]
🚀 节点选择 = select, 🇭🇰 香港 01, 🇯🇵 日本, DIRECT
🎬 流媒体 = fallback, 🇯🇵 日本, 🇭🇰 香港 01

[Rule]
DOMAIN-SUFFIX,例子.测试,🚀 节点选择
DOMAIN,BÜCHER.example,🎬 流媒体
DOMAIN-WILDCARD,*.日本.example,🎬 流媒体
FINAL,🚀 节点选择

[Host]
本地.例子.测试 = 192.0.2.80
