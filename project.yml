# XcodeGen 工程定义（docs/03 §4，ADR-008）。Aether.xcodeproj 由它生成，不入库。
# 修改工程结构只改本文件，然后运行 ./Scripts/bootstrap.sh。
# 标识符全部来自 Config/*.xcconfig 中的 AETHER_* 变量（docs/03 §3），这里不得写死任何标识符。
name: Aether

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: zh-Hans

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"

packages:
  AetherKit:
    path: Packages/AetherKit

targets:
  Aether:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Aether
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hans
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        AetherBundleIdentifierPrefix: $(AETHER_BUNDLE_ID_PREFIX)
        AetherAppGroupIdentifier: $(AETHER_APP_GROUP)
        AetherKeychainAccessGroup: $(AETHER_KEYCHAIN_GROUP)
        AetherTunnelBundleIdentifier: $(AETHER_TUNNEL_BUNDLE_ID)
        AetherURLScheme: $(AETHER_URL_SCHEME)
        CFBundleURLTypes:
          - CFBundleURLName: $(AETHER_BUNDLE_ID_PREFIX)
            CFBundleURLSchemes: [$(AETHER_URL_SCHEME)]
    entitlements:
      path: App/Aether.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [$(AETHER_APP_GROUP)]
        keychain-access-groups: [$(AETHER_KEYCHAIN_GROUP)]
        com.apple.developer.networking.wifi-info: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AETHER_BUNDLE_ID_PREFIX)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - target: AetherTunnel
      - package: AetherKit
        # M5 起加入 AetherCertificates，M6 起加入 AetherScript（见 02 §3.2）
        products: [AetherFoundation, AetherProfile, AetherRules, AetherIPC, AetherStore, AetherControl, AetherKeychain]

  AetherTunnel:
    type: app-extension
    platform: iOS
    sources:
      - Tunnel/Sources
      - Tunnel/Resources
    info:
      path: Tunnel/Info.plist
      properties:
        CFBundleDisplayName: Aether Tunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AetherBundleIdentifierPrefix: $(AETHER_BUNDLE_ID_PREFIX)
        AetherAppGroupIdentifier: $(AETHER_APP_GROUP)
        AetherKeychainAccessGroup: $(AETHER_KEYCHAIN_GROUP)
        AetherTunnelBundleIdentifier: $(AETHER_TUNNEL_BUNDLE_ID)
        AetherURLScheme: $(AETHER_URL_SCHEME)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: Tunnel/AetherTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [$(AETHER_APP_GROUP)]
        keychain-access-groups: [$(AETHER_KEYCHAIN_GROUP)]
        com.apple.developer.networking.wifi-info: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AETHER_TUNNEL_BUNDLE_ID)
    dependencies:
      - package: AetherKit
        products: [AetherFoundation, AetherEngine, AetherTunnelSupport, AetherKeychain, AetherScript, AetherIPC, AetherStore]

schemes:
  Aether:
    build:
      targets:
        Aether: all
        AetherTunnel: all
    run:
      config: Debug
    archive:
      config: Release
